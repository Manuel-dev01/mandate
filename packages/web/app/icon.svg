  <path d="M9 6h14v18.5l-2.33-1.4-2.34 1.4-2.33-1.4-2.33 1.4-2.34-1.4L9 24.5Z" fill="#f2ede3"/>
  <!-- printed rows -->
  <rect x="11.5" y="9" width="9" height="1.4" rx="0.7" fill="#0d0d0c" opacity=".78"/>
  <rect x="11.5" y="12.2" width="6" height="1.4" rx="0.7" fill="#0d0d0c" opacity=".55"/>
  <!-- the refusal: the one row that matters -->
  <rect x="11.5" y="15.4" width="9" height="1.4" rx="0.7" fill="#c8402f"/>
  <rect x="11.5" y="18.6" width="4.5" height="1.4" rx="0.7" fill="#0d0d0c" opacity=".38"/>
</svg>
